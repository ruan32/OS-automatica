<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Ordem de Serviço</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 0;
    }

    .container {
    width: 90%;
    max-width: 600px;
    margin: 80px auto;
    background-color: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .container h1 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 28px;
    text-align: center;
    }

    .container p {
        margin-bottom: 30px;
        text-align: center;
        color: #666;
        line-height: 1.5;
    }

    button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;

    border: none;
    border-radius: 8px;

    background-color: #2563eb;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
    }

    button:hover {
        background-color: #1d4ed8;
    }

    button:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
    }

    .area-arquivo {
    width: 100%;
    min-height: 60px;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px;

    border: none;
    border-radius: 8px;

    background-color: #dc2626;

    cursor: pointer;
    text-align: center;

    transition: 0.2s;
    }

    .area-arquivo:hover {
        border-color: #b91c1c;
        background-color: #b91c1c;
    }

    .area-arquivo input[type="file"] {
        display: none;
    }

    #texto-arquivo {
        max-width: 100%;
        font-weight: 600;
        color: white;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>

</head>

<body>

    <div class="container">

    <h1>Gerador de Ordem de Serviço</h1>

    <p>
        Envie o arquivo PGR para gerar automaticamente
        as Ordens de Serviço.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

    <label class="area-arquivo" for="arquivo_pdf">
    <span id="texto-arquivo">
        Escolher arquivo PDF
    </span>

    <input
        type="file"
        id="arquivo_pdf"
        name="arquivo_pdf"
        accept=".pdf"
        required
    >
    </label>

    <button type="submit">
        Gerar Ordens de Serviço
    </button>


</form>

</div>

<script>
    const formulario = document.querySelector("form");
    const botao = formulario.querySelector("button");
    const inputArquivo = document.getElementById("arquivo_pdf");
    const textoArquivo = document.getElementById("texto-arquivo");

    inputArquivo.addEventListener("change", function () {
        if (inputArquivo.files.length > 0) {
            textoArquivo.textContent = inputArquivo.files[0].name;
        } else {
            textoArquivo.textContent = "Escolher arquivo PDF";
        }
    });

    formulario.addEventListener("submit", function () {
        botao.disabled = true;
        botao.textContent = "Gerando Ordens de Serviço...";
    });
</script>

</body>

</html>
